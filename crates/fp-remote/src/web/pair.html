<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>{{remote-unpaired-title:FramePlayerX Remote: not paired}}</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <section class="card">
    <h1>{{remote-pair-heading:Pair with the headset}}</h1>
    <p>{{remote-unpaired-desc:This browser has not been paired with the headset yet, or the pairing was reset.}}</p>
    <p>{{remote-pair-how:In FramePlayerX, open Settings › Remote control and enter the code it shows.}}</p>
    <form class="row" method="post" action="/pair" autocomplete="off">
      <label for="code" class="sr-only">{{remote-pair-code:Code}}</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="{{remote-pair-code:Code}}" required autofocus>
      <button type="submit" class="primary">{{remote-pair:Pair}}</button>
    </form>
    <p class="hint bad" role="alert">{{pair-message:}}</p>
  </section>
</main>
</body>
</html>
