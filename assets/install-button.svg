<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 56" width="300" height="56">
  <!-- The docs' download button for the Desktop Mode installer, sized to
       be easy to hit with a controller pointer in the headset's browser. -->
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CA0FF"/>
      <stop offset="1" stop-color="#AA6EFF"/>
    </linearGradient>
  </defs>
  <rect width="300" height="56" rx="12" fill="url(#fill)"/>
  <!-- download arrow into a tray -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 14V32M18 25L26 33L34 25"/>
    <path d="M16 36V39A3 3 0 0 0 19 42H33A3 3 0 0 0 36 39V36"/>
  </g>
  <text x="48" y="34.5" fill="#FFFFFF" font-size="18" font-weight="700"
        font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Helvetica, Arial, sans-serif">Download the installer</text>
</svg>
